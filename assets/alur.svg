<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" role="img" aria-label="Alur kerja Rekrut Lokal: unggah CV, saring berbukti, wawancara, penawaran, diterima">
  <defs>
    <linearGradient id="accentFlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bb371e"/>
      <stop offset="100%" stop-color="#e05a3a"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#191919" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="#fafafa"/>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="58" font-size="14" font-weight="700" fill="#a3321b" letter-spacing="1.6">ALUR KERJA</text>
    <text x="800" y="104" font-size="36" font-weight="800" fill="#191919" letter-spacing="-1">Dari CV masuk sampai kandidat diterima.</text>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- Card 1 -->
    <g transform="translate(60, 150)">
      <rect width="268" height="220" rx="22" fill="#fff" filter="url(#cardShadow)"/>
      <circle cx="46" cy="46" r="24" fill="#fdf0ec"/>
      <g stroke="#bb371e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M38 34h12l6 6v18H38z"/>
        <path d="M50 34v6h6"/>
        <path d="M46 56v-8m0 0-4 4m4-4 4 4"/>
      </g>
      <text x="88" y="42" font-size="12" font-weight="700" fill="#a3321b">LANGKAH 1</text>
      <text x="88" y="66" font-size="19" font-weight="700" fill="#191919">Unggah CV</text>
      <text x="26" y="112" font-size="14" fill="#6b615c">PDF, gambar, atau CSV.</text>
      <text x="26" y="136" font-size="14" fill="#6b615c">Teks diekstrak lokal di</text>
      <text x="26" y="160" font-size="14" fill="#6b615c">komputer Anda.</text>
      <rect x="26" y="182" width="104" height="24" rx="12" fill="#f4efec"/>
      <text x="78" y="198" font-size="11" font-weight="600" fill="#7a6f6a" text-anchor="middle">Tanpa cloud</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(366, 150)">
      <rect width="268" height="220" rx="22" fill="#fff" filter="url(#cardShadow)"/>
      <circle cx="46" cy="46" r="24" fill="#fdf0ec"/>
      <g stroke="#bb371e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="44" cy="42" r="8"/>
        <path d="M50 48l6 6"/>
        <path d="M40 42l3 3 6-6"/>
      </g>
      <text x="88" y="42" font-size="12" font-weight="700" fill="#a3321b">LANGKAH 2</text>
      <text x="88" y="66" font-size="19" font-weight="700" fill="#191919">Saring berbukti</text>
      <text x="26" y="112" font-size="14" fill="#6b615c">Cocokkan kriteria wajib</text>
      <text x="26" y="136" font-size="14" fill="#6b615c">dan nilai plus dengan</text>
      <text x="26" y="160" font-size="14" fill="#6b615c">kutipan CV aslinya.</text>
      <rect x="26" y="182" width="104" height="24" rx="12" fill="#e8f5ee"/>
      <text x="78" y="198" font-size="11" font-weight="600" fill="#2f8a5d" text-anchor="middle">Bisa diperiksa</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(672, 150)">
      <rect width="268" height="220" rx="22" fill="#fff" filter="url(#cardShadow)"/>
      <circle cx="46" cy="46" r="24" fill="#fdf0ec"/>
      <g stroke="#bb371e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="36" y="34" width="20" height="20" rx="4"/>
        <path d="M36 41h20M42 30v6M50 30v6"/>
      </g>
      <text x="88" y="42" font-size="12" font-weight="700" fill="#a3321b">LANGKAH 3</text>
      <text x="88" y="66" font-size="19" font-weight="700" fill="#191919">Wawancara</text>
      <text x="26" y="112" font-size="14" fill="#6b615c">Jadwal, undangan .ics,</text>
      <text x="26" y="136" font-size="14" fill="#6b615c">panduan pertanyaan, dan</text>
      <text x="26" y="160" font-size="14" fill="#6b615c">scorecard pewawancara.</text>
      <rect x="26" y="182" width="104" height="24" rx="12" fill="#fdf3e3"/>
      <text x="78" y="198" font-size="11" font-weight="600" fill="#b7791f" text-anchor="middle">Terstruktur</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(978, 150)">
      <rect width="268" height="220" rx="22" fill="#fff" filter="url(#cardShadow)"/>
      <circle cx="46" cy="46" r="24" fill="#fdf0ec"/>
      <g stroke="#bb371e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M36 32h16l4 4v22H36z"/>
        <path d="M40 44h8M40 50h8M40 56h5"/>
      </g>
      <text x="88" y="42" font-size="12" font-weight="700" fill="#a3321b">LANGKAH 4</text>
      <text x="88" y="66" font-size="19" font-weight="700" fill="#191919">Penawaran</text>
      <text x="26" y="112" font-size="14" fill="#6b615c">Susun penawaran, minta</text>
      <text x="26" y="136" font-size="14" fill="#6b615c">persetujuan Admin, lalu</text>
      <text x="26" y="160" font-size="14" fill="#6b615c">catat jawaban kandidat.</text>
      <rect x="26" y="182" width="104" height="24" rx="12" fill="#e8edf9"/>
      <text x="78" y="198" font-size="11" font-weight="600" fill="#3d5bb5" text-anchor="middle">Tercatat</text>
    </g>

    <!-- Card 5 -->
    <g transform="translate(1284, 150)">
      <rect width="268" height="220" rx="22" fill="#fff" filter="url(#cardShadow)"/>
      <circle cx="46" cy="46" r="24" fill="url(#accentFlow)"/>
      <path d="M36 46l7 7 14-15" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="42" font-size="12" font-weight="700" fill="#a3321b">HASIL</text>
      <text x="88" y="66" font-size="19" font-weight="700" fill="#191919">Diterima</text>
      <text x="26" y="112" font-size="14" fill="#6b615c">Riwayat tahap, alasan</text>
      <text x="26" y="136" font-size="14" fill="#6b615c">keputusan, dan laporan</text>
      <text x="26" y="160" font-size="14" fill="#6b615c">tetap tersimpan.</text>
      <rect x="26" y="182" width="104" height="24" rx="12" fill="#e8f5ee"/>
      <text x="78" y="198" font-size="11" font-weight="600" fill="#2f8a5d" text-anchor="middle">Siap diaudit</text>
    </g>

    <!-- Arrows -->
    <g stroke="#d8ccc6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M332 260h22m-6-6 6 6-6 6"/>
      <path d="M638 260h22m-6-6 6 6-6 6"/>
      <path d="M944 260h22m-6-6 6 6-6 6"/>
      <path d="M1250 260h22m-6-6 6 6-6 6"/>
    </g>
  </g>
</svg>
