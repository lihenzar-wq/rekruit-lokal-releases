          <circle cx="22" cy="24" r="11" fill="#f3ded6"/>
          <text x="16" y="28" font-size="10" font-weight="700" fill="#a3321b">AS</text>
          <text x="40" y="28" font-size="12" font-weight="600" fill="#191919">Ayu S.</text>
