<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-label="Ilustrasi antarmuka Rekrut Lokal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f3ece8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bb371e"/>
      <stop offset="100%" stop-color="#e05a3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#191919" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#191919" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <circle cx="1430" cy="90" r="220" fill="#bb371e" opacity="0.07"/>
  <circle cx="240" cy="700" r="180" fill="#bb371e" opacity="0.05"/>

  <!-- Left: wordmark and message -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <g transform="translate(96, 150)">
      <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#accent)"/>
      <text x="20" y="46" font-size="36" font-weight="800" fill="#fff" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">R</text>
      <text x="84" y="28" font-size="26" font-weight="700" fill="#191919" letter-spacing="-0.4">Rekrut Lokal</text>
      <text x="84" y="54" font-size="15" font-weight="500" fill="#7a6f6a">ATS lokal untuk Windows</text>
    </g>

    <g transform="translate(96, 300)">
      <rect x="0" y="0" width="332" height="36" rx="18" fill="#bb371e" opacity="0.12"/>
      <text x="18" y="24" font-size="14" font-weight="700" fill="#a3321b" letter-spacing="1.2">UNTUK TIM REKRUTMEN</text>

      <text x="0" y="106" font-size="66" font-weight="800" fill="#191919" letter-spacing="-2.4">Rekrutmen lokal.</text>
      <text x="0" y="178" font-size="66" font-weight="800" fill="url(#accent)" letter-spacing="-2.4">Data tetap milik Anda.</text>

      <text x="0" y="236" font-size="21" fill="#5f5651">Lowongan, penyaringan CV, wawancara, penawaran,</text>
      <text x="0" y="266" font-size="21" fill="#5f5651">dan laporan dalam satu aplikasi.</text>

      <g transform="translate(0, 312)" font-size="15" font-weight="600">
        <g transform="translate(0,0)">
          <rect width="128" height="44" rx="22" fill="#fff" stroke="#e6ddd8"/>
          <circle cx="23" cy="22" r="5" fill="#2f9e6b"/>
          <text x="38" y="27" fill="#3d3633">Offline</text>
        </g>
        <g transform="translate(142,0)">
          <rect width="138" height="44" rx="22" fill="#fff" stroke="#e6ddd8"/>
          <circle cx="23" cy="22" r="5" fill="#bb371e"/>
          <text x="38" y="27" fill="#3d3633">Windows</text>
        </g>
        <g transform="translate(294,0)">
          <rect width="216" height="44" rx="22" fill="#fff" stroke="#e6ddd8"/>
          <circle cx="23" cy="22" r="5" fill="#3d6fd6"/>
          <text x="38" y="27" fill="#3d3633">Backup terenkripsi</text>
        </g>
      </g>
    </g>
